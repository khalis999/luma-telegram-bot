build:
  system: docker

dockerfile_path: "./Dockerfile"

# Keep a single always-on instance so Telegram long polling has one owner.
scaling:
  trigger: http_requests
  min_replicas: 1
  max_replicas: 1
  min_cpu: 0.1
  max_cpu: 0.5
  min_memory: 256
  max_memory: 512

health_check:
  type: http
  http_path: "/health"
  interval_in_seconds: 30

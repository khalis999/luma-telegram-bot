<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff7fb" />
    <title>Luma Copilot</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div class="brand-mark" aria-hidden="true">L</div>
        <div>
          <p class="eyebrow">PRIVATE COPILOT</p>
          <h1>Luma</h1>
          <p class="subtitle">Аудит диалогов и безопасные ответы</p>
        </div>
      </header>

      <section class="quick-actions" aria-label="Быстрые действия">
        <button class="quick-action active" data-quick-mode="audit" type="button"><span>🧠</span>Аудит</button>
        <button class="quick-action" data-quick-mode="reply" type="button"><span>✍️</span>Ответ</button>
        <button class="quick-action" data-quick-mode="filter" type="button"><span>🛡</span>Фильтр</button>
        <button class="quick-action" data-panel="templates" type="button"><span>📚</span>Шаблоны</button>
        <button class="quick-action" data-panel="card" type="button"><span>👤</span>Карточка</button>
        <button class="quick-action" data-panel="plan" type="button"><span>🗓</span>План</button>
      </section>

      <section id="workspace-panel" class="card workspace-panel" hidden aria-live="polite"></section>

      <section class="card input-card" aria-labelledby="input-title">
        <div class="section-heading">
          <div>
            <span class="step">01</span>
            <h2 id="input-title">Добавьте диалог</h2>
          </div>
          <span class="privacy-pill">Без истории</span>
        </div>

        <div class="mode-switch" role="group" aria-label="Режим анализа">
          <button class="mode active" data-mode="audit" type="button">Полный аудит</button>
          <button class="mode" data-mode="reply" type="button">Только ответ</button>
          <button class="mode" data-mode="filter" type="button">Проверка</button>
        </div>

        <label class="field-label" for="dialogue">Текст переписки</label>
        <textarea
          id="dialogue"
          rows="8"
          placeholder="Вставьте переписку или добавьте скриншоты ниже…"
          maxlength="40000"
        ></textarea>

        <label class="upload" for="screenshots">
          <span class="upload-icon">＋</span>
          <span>
            <strong>Добавить скриншоты</strong>
            <small>До 10 изображений в правильном порядке</small>
          </span>
        </label>
        <input id="screenshots" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden />
        <div id="file-list" class="file-list" aria-live="polite"></div>

        <button id="analyze" class="primary" type="button">
          <span>Проверить диалог</span>
          <span aria-hidden="true">→</span>
        </button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>

      <section id="result" class="result" hidden aria-live="polite">
        <div class="score-card">
          <div>
            <p class="eyebrow">LUMA SCORE</p>
            <p id="stage" class="stage"></p>
          </div>
          <div id="score" class="score">—</div>
        </div>

        <article class="card">
          <div class="section-heading">
            <div>
              <span class="step">02</span>
              <h2>Разбор</h2>
            </div>
            <span id="safety-badge" class="safety-badge"></span>
          </div>
          <p id="summary" class="summary"></p>
          <div id="issues" class="issues"></div>
        </article>

        <article class="card">
          <div class="section-heading">
            <div>
              <span class="step">03</span>
              <h2>Варианты ответа</h2>
            </div>
            <div class="language-switch" role="group" aria-label="Язык ответа">
              <button class="language active" data-language="ru" type="button">RU</button>
              <button class="language" data-language="en" type="button">EN</button>
            </div>
          </div>
          <div id="replies" class="replies"></div>
        </article>
      </section>
    </main>
  </body>
</html>
